name: Daily Healthcare Provider Scraper

on:
  schedule:
    # 6:00 AM UTC = midnight Central (CST) / 1:00 AM Central (CDT)
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  scrape-and-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: ./scrapers
        run: |
          pip install -r requirements.txt
          playwright install chromium

      # Persist geocode results AND the monthly budget counter across runs.
      # geocode_cache.json: already-geocoded addresses are never re-billed.
      # geocode_monthly_budget.json: tracks calls made in the current
      # calendar month so nightly runs self-throttle to stay inside the
      # Geocoding API's free monthly tier (see geocode_helper.py).
      - name: Restore geocode cache and monthly budget
        uses: actions/cache@v4
        with:
          path: |
            scrapers/geocode_cache.json
            scrapers/geocode_monthly_budget.json
          key: geocode-cache-${{ github.run_id }}
          restore-keys: |
            geocode-cache-

      # Note: normalization logic is unit-tested separately in the test-normalization workflow
      # MVP scope: scrape only the three home-based-care programs (Home
      # Care, Home Health, Hospice) -- the site's actual content focus.
      #
      # 2026-08-01: promoted from the MVP-scope diagnostic (geocoding/
      # Supabase writes both off, report-only) to a real live run.
      # Confirmed via GitHub Actions run history that every night up to
      # this point completed "successfully" while writing nothing --
      # ENABLE_GEOCODING/ENABLE_DIRECT_SUPABASE were hardcoded false, so
      # the site's live data was frozen at whatever populate_mvp_supabase.py
      # (a one-time manual local run) last wrote, not actually kept
      # current by this "daily" workflow. geocode_helper.py's dedup +
      # monthly-budget-cap mechanism (GEOCODE_MONTHLY_BUDGET, default
      # 9500, well under Google's free tier) was reviewed and is sound,
      # so this is now a real nightly refresh, self-throttled to stay
      # inside the free tier. ENABLE_WEBSITE_ENRICHMENT stays off
      # deliberately -- that's the Places API path, replaced by the
      # search-deep-link approach (see MVP-Rollout-Roadmap.md), unrelated
      # to this change and still subject to its own required double
      # confirmation before ever being turned on.
      #
      # 2026-08-02: TEST_MODE flipped false -- true was silently
      # suppressing the "0 rows scraped" failure check in
      # achc_scraper.py (`if not all_rows and not TEST_MODE: raise`),
      # meaning a real scraper break (site down, selector change) would
      # have reported this run as "success" while writing nothing. The
      # exact same silent-failure shape as the geocoding-disabled bug
      # found earlier -- want a loud failure here, not another quiet one.
      - name: Run ACHC scraper and write raw + merged tabs
        working-directory: ./scrapers
        env:
          LIMIT_LOCATIONS: 0
          TEST_MODE: "false"
          TEST_PROGRAMS: "Home Care,Home Health,Hospice"
          SCRAPER_SECRET: ${{ secrets.SCRAPER_SECRET }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          ENABLE_GEOCODING: "true"
          ENABLE_WEBSITE_ENRICHMENT: "false"
          ENABLE_DIRECT_SUPABASE: "true"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DUMP_NORMALIZED_JSON_PATH: "normalized_dump.json"
          GOOGLE_SHEETS_WEB_APP_URL: ${{ secrets.GOOGLE_SHEETS_WEB_APP_URL }}
        run: |
          python run_scraper_and_merge.py

      - name: Upload normalized data dump
        uses: actions/upload-artifact@v4
        with:
          name: normalized-dump
          path: scrapers/normalized_dump.json
          retention-days: 7

      # Production Supabase writes happen directly from the scraper
      # (write_to_supabase_direct, ENABLE_DIRECT_SUPABASE) above. Google
      # Sheets is now a read-only backup/audit trail only -- nothing reads
      # from Sheets back into Supabase, so there is no second, potentially
      # stale write path and no need for the sync-google-sheets Edge
      # Function to be reachable. See P0-019/P0-020 in the strategy doc.

      - name: Notify on failure
        if: failure()
        env:
          GOOGLE_SHEETS_WEB_APP_URL: ${{ secrets.GOOGLE_SHEETS_WEB_APP_URL }}
          SCRAPER_SECRET: ${{ secrets.SCRAPER_SECRET }}
        run: |
          curl -s -X POST "$GOOGLE_SHEETS_WEB_APP_URL" \
            -H "Content-Type: application/json" \
            -d "{\"action\": \"notify_failure\", \"secret\": \"$SCRAPER_SECRET\", \"run_id\": \"run_$(date -u +%Y%m%dT%H%M%SZ)\", \"github_run_id\": \"${{ github.run_id }}\", \"workflow\": \"${{ github.workflow }}\"}"
