name: Daily Healthcare Provider Scraper

on:
  schedule:
    # 6:00 AM UTC = midnight Central (CST) / 1:00 AM Central (CDT)
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  scrape-and-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: ./scrapers
        run: |
          pip install -r requirements.txt
          playwright install chromium

      # Persist geocode results across runs so already-geocoded addresses are
      # never re-billed to the Geocoding API. Without this, the cache file
      # starts empty every run and every provider gets re-geocoded nightly.
      - name: Restore geocode cache
        uses: actions/cache@v4
        with:
          path: scrapers/geocode_cache.json
          key: geocode-cache-${{ github.run_id }}
          restore-keys: |
            geocode-cache-

      # Note: normalization logic is unit-tested separately in the test-normalization workflow
      # DIAGNOSTIC PASS: full national pull, but geocoding/Supabase/Sheets are
      # all off. This only scrapes, normalizes, and reports the dedup counts
      # (raw rows -> normalized providers -> unique addresses) so the real
      # geocoding call count can be confirmed before anything is billed or
      # written to production. Flip ENABLE_GEOCODING / ENABLE_DIRECT_SUPABASE
      # back on for the real run once the numbers check out.
      - name: Run ACHC scraper and write raw + merged tabs
        working-directory: ./scrapers
        env:
          LIMIT_LOCATIONS: 0
          TEST_MODE: "true"
          SCRAPER_SECRET: ${{ secrets.SCRAPER_SECRET }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          ENABLE_GEOCODING: "false"
          ENABLE_WEBSITE_ENRICHMENT: "false"
          ENABLE_DIRECT_SUPABASE: "false"
        run: |
          python run_scraper_and_merge.py

      # Production Supabase writes happen directly from the scraper
      # (write_to_supabase_direct, ENABLE_DIRECT_SUPABASE) above. Google
      # Sheets is now a read-only backup/audit trail only -- nothing reads
      # from Sheets back into Supabase, so there is no second, potentially
      # stale write path and no need for the sync-google-sheets Edge
      # Function to be reachable. See P0-019/P0-020 in the strategy doc.

      - name: Notify on failure
        if: failure()
        env:
          GOOGLE_SHEETS_WEB_APP_URL: ${{ secrets.GOOGLE_SHEETS_WEB_APP_URL }}
          SCRAPER_SECRET: ${{ secrets.SCRAPER_SECRET }}
        run: |
          curl -s -X POST "$GOOGLE_SHEETS_WEB_APP_URL" \
            -H "Content-Type: application/json" \
            -d "{\"action\": \"notify_failure\", \"secret\": \"$SCRAPER_SECRET\", \"run_id\": \"run_$(date -u +%Y%m%dT%H%M%SZ)\", \"github_run_id\": \"${{ github.run_id }}\", \"workflow\": \"${{ github.workflow }}\"}"
