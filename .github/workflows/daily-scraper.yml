name: Daily Healthcare Provider Scraper

on:
  schedule:
    # 6:00 AM UTC = midnight Central (CST) / 1:00 AM Central (CDT)
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  scrape-and-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: ./scrapers
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: Run ACHC scraper and write raw + merged tabs
        working-directory: ./scrapers
        env:
          GOOGLE_SHEETS_WEB_APP_URL: ${{ secrets.GOOGLE_SHEETS_WEB_APP_URL }}
          LIMIT_LOCATIONS: 3
          TEST_MODE=true
        run: |
          python run_scraper_and_merge.py

      - name: Notify on failure
        if: failure()
        env:
          GOOGLE_SHEETS_WEB_APP_URL: ${{ secrets.GOOGLE_SHEETS_WEB_APP_URL }}
        run: |
          curl -s -X POST "$GOOGLE_SHEETS_WEB_APP_URL" \
            -H "Content-Type: application/json" \
            -d "{\"action\": \"notify_failure\", \"run_id\": \"run_$(date -u +%Y%m%dT%H%M%SZ)\", \"github_run_id\": \"${{ github.run_id }}\", \"workflow\": \"${{ github.workflow }}\"}"
